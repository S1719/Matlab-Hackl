name: MATLAB CI

on:
workflow_dispatch:

jobs:
matlab-test:
runs-on: self-hosted

steps:
  - name: Repository auschecken
    uses: actions/checkout@v4

  - name: MATLAB-Installation prüfen
    shell: cmd
    run: |
      echo Runner-OS: %RUNNER_OS%
      echo Workspace: %GITHUB_WORKSPACE%
      if not exist "C:\Program Files\MATLAB\R2023b\bin\matlab.exe" exit /b 1
      "C:\Program Files\MATLAB\R2023b\bin\matlab.exe" -batch "disp('MATLAB funktioniert')"


