name: MATLAB CI

on:		# Trigger workflow bei push und pull request -> für "main" und "master" branch
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken             # Repository prüfen
        uses: actions/checkout@v4

      - name: MATLAB einrichten                 # Matlab einrichten/starten
        uses: matlab-actions/setup-matlab@v2

      - name: MATLAB/Simulink Diagnose
        uses: matlab-actions/run-command@v2
        with:
          command: "ver; which load_system -all; license('test','Simulink')"

      - name: MATLAB-/Simulink-Tests ausführen  # Simulink testen
        uses: matlab-actions/run-command@v2
        with:
          command: "cd(getenv('MW_ORIG_WORKING_FOLDER')); addpath(genpath(pwd)); run_all_tests"

      - name: Testergebnisse hochladen          # Testergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/
          if-no-files-found: warn
