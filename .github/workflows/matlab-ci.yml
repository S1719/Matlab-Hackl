name: MATLAB CI

on:		# Trigger workflow bei push und pull request -> für "main" und "master" branch
  push:
    branches: 
      - main
      - master
      - develop
  pull_request:
    branches:                                  # [main, master]
  workflow_dispatch:

jobs:
  test: 
    runs-on: self-hosted

    steps:
      - name: Repository auschecken             # Repository prüfen
        uses: actions/checkout@v4
        
      - name: Run MATLAB Tests                  # Selfhosted Runner Arthur
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2023b\bin\matlab.exe" -batch "addpath(genpath(getenv('GITHUB_WORKSPACE'))); results = runtests('Testcases'); disp(results); assertSuccess(results);"

      - name: MATLAB mit Simulink einrichten
        uses: matlab-actions/setup-matlab@v2
        with:
          products: Simulink

      - name: Umgebung und Verfügbarkeit diagnostizieren
        uses: matlab-actions/run-command@v2
        with:
          command: |
            clc
            rehash

            disp('=== MATLAB / Simulink CI Diagnose ===')
            fprintf('Aktueller Ordner: %s\n', pwd)

            repoRoot = pwd;
            modelFile = fullfile(repoRoot, 'Hackl_Pilsen_Algo.slx');
            initFile  = fullfile(repoRoot, 'Messdaten_Interpoliert.m');
            initFile1 = fullfile(repoRoot, 'Maschinendaten_Vorgabe.m');
            lutFile   = fullfile(repoRoot, 'LUT_BRUSA_jax_grad.mat');
            dataFile  = fullfile(repoRoot, 'daten_nichtlinear_interpoliert.mat');
            dataFile1 = fullfile(repoRoot, 'Maschinendaten.mat');
            testsDir  = fullfile(repoRoot, 'tests');

            fprintf('MATLAB Version: %s\n', version)
            fprintf('load_system verfügbar: %d\n', exist('load_system', 'file') == 2)
            fprintf('Simulink Lizenz verfügbar: %d\n', license('test', 'Simulink'))

            fprintf('Modell vorhanden (isfile): %d -> %s\n', isfile(modelFile), modelFile)
            fprintf('Init-Skript vorhanden (isfile): %d -> %s\n', isfile(initFile), initFile)
            fprintf('Maschinen-Skript vorhanden (isfile): %d -> %s\n', isfile(initFile1), initFile1)
            fprintf('LUT vorhanden (isfile): %d -> %s\n', isfile(lutFile), lutFile)
            fprintf('Interpolierte Daten vorhanden (isfile): %d -> %s\n', isfile(dataFile), dataFile)
            fprintf('Maschinendaten vorhanden (isfile): %d -> %s\n', isfile(dataFile1), dataFile1)
            fprintf('Tests-Ordner vorhanden (isfolder): %d -> %s\n', isfolder(testsDir), testsDir)

            disp('--- Inhalt des Repository-Root ---')
            rootListing = dir(repoRoot);
            disp(string({rootListing.name})')

            disp('--- Inhalt des tests-Ordners ---')
            if isfolder(testsDir)
                testsListing = dir(testsDir);
                disp(string({testsListing.name})')
            end

            assert(exist('load_system', 'file') == 2, ...
                'Simulink ist nicht verfügbar: load_system fehlt.')
            assert(license('test', 'Simulink'), ...
                'Simulink-Lizenz ist nicht verfügbar.')
            assert(isfile(modelFile), ...
                ['Modell-Datei Hackl_Pilsen_Algo.slx wurde nicht gefunden: ' modelFile])
            assert(isfile(initFile), ...
                ['Initialisierungsskript Messdaten_Interpoliert.m wurde nicht gefunden: ' initFile])

            disp('Versuche Modell zu laden ...')
            load_system(modelFile)
            fprintf('Modell erfolgreich geladen: %s\n', bdroot)
            close_system(bdroot, 0)

            disp('=== Diagnose erfolgreich abgeschlossen ===')

      - name: Tests ausführen
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath(genpath(pwd));
            run_all_tests
