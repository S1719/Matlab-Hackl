name: MATLAB CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Diagnose ausführen
        shell: cmd
        run: |
          "C:\Program Files\MATLAB\R2023b\bin\matlab.exe" -batch "cd(getenv('GITHUB_WORKSPACE')); ci_diagnose"
      
     - name: Tests ausführen
       shell: cmd
       run: |
           "C:\Program Files\MATLAB\R2023b\bin\matlab.exe" -batch "cd(getenv('GITHUB_WORKSPACE')); addpath(genpath(pwd)); run_all_tests"
